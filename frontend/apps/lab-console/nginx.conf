worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    map $http_host $allowed_host {
        default 0;
        "127.0.0.1:8080" 1;
        "localhost:8080" 1;
    }
    server {
        listen 8080;
        root /usr/share/nginx/html;
        if ($allowed_host = 0) { return 403; }
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        client_max_body_size 16k;
        location = / { try_files /index.html =404; }
        location = /index.html { try_files $uri =404; }
        location = /app.js { try_files $uri =404; }
        location = /style.css { try_files $uri =404; }
        location /lab/ {
            resolver 127.0.0.11 valid=5s ipv6=off;
            set $lab_upstream http://lab-bff:8080;
            proxy_pass $lab_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_next_upstream off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 120s;
            proxy_send_timeout 30s;
            # BFF owns its security headers; avoid duplicating CSP on proxied responses.
            proxy_hide_header Cache-Control;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Content-Security-Policy;
        }
        location / { return 404; }
    }
}
