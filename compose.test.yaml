name: agentgate-integration
services:
  postgres-test:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: agentgate
      POSTGRES_DB: agentgate_test
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U agentgate -d agentgate_test"]
      interval: 1s
      timeout: 3s
      retries: 30
    networks: [testing]
  tests:
    build:
      context: ./backend/services/agentgate
      target: verification
    environment:
      AGENTGATE_TEST_POSTGRES: postgres-test
      AGENTGATE_TEST_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    depends_on:
      postgres-test: {condition: service_healthy}
    networks: [testing]
networks:
  testing: {internal: true}
secrets:
  postgres_password: {file: ./.lab-secrets/postgres_password}
