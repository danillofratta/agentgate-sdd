name: Development Harness CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Python 3.12 is the currently verified supported version.
        python-version: ["3.12.14"]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.5"
          python-version: ${{ matrix.python-version }}
          enable-cache: false

      - name: Install locked Python dependencies
        run: uv sync --locked --group dev

      - name: Set up Node for OpenSpec
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # OpenSpec toolchain; independent of the action's internal Node 24 runtime.
          node-version: "22.16.0"
          package-manager-cache: false

      - name: Install pinned OpenSpec CLI
        run: npm install --global --ignore-scripts --no-audit --no-fund @fission-ai/openspec@1.14.3

      - name: Pytest (including architecture tests)
        run: uv run --locked python -m pytest -q

      - name: Offline frontend behavior
        run: node --test tests/frontend/console.test.cjs

      - name: Ruff lint
        run: uv run --locked python -m ruff check .

      - name: Ruff formatting
        run: uv run --locked python -m ruff format --check .

      - name: Mypy strict
        run: uv run --locked python -m mypy --strict src

      - name: OpenSpec strict validation
        run: openspec validate --all --strict

  interactive-lab:
    name: PostgreSQL integration and Docker smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.5"
          python-version: "3.12.14"
          enable-cache: false
      - name: Install locked dependencies and generate ephemeral secrets
        run: |
          uv sync --locked --python 3.12
          uv run --locked python - <<'PY'
          import os
          import secrets
          from pathlib import Path
          root = Path('.lab-secrets')
          root.mkdir(mode=0o700)
          for name in ('postgres_password', 'agent_token', 'approver_token', 'mcp_token'):
              path = root / name
              path.write_text(secrets.token_urlsafe(48), encoding='utf-8')
              os.chmod(path, 0o600)
          # Optional LLM credential: no real provider in CI.
          llm_key = root / 'llm_api_key'
          llm_key.write_text('', encoding='utf-8')
          os.chmod(llm_key, 0o600)
          PY
          sudo chgrp 10001 .lab-secrets/*
          sudo chmod 0640 .lab-secrets/*
      - name: PostgreSQL integration tests
        run: docker compose -f compose.test.yaml up --build --abort-on-container-exit --exit-code-from tests
      - name: Start local lab
        run: docker compose up --build -d --wait
      - name: Docker workflow and restart smoke
        run: uv run --locked python scripts/smoke_lab.py
      - name: Real MCP SDK workflow and restart smoke
        run: uv run --locked python scripts/smoke_mcp.py
      - name: Stop test containers and retain data volumes
        if: always()
        run: |
          docker compose -f compose.test.yaml down
          docker compose down
