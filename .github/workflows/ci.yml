name: Development Harness CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Python 3.12 is the currently verified supported version.
        python-version: ["3.12.14"]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.5"
          python-version: ${{ matrix.python-version }}
          enable-cache: false

      - name: Install locked Python dependencies
        run: uv sync --locked --group dev

      - name: Set up Node for OpenSpec
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.16.0"

      - name: Install pinned OpenSpec CLI
        run: npm install --global --ignore-scripts --no-audit --no-fund @fission-ai/openspec@1.14.3

      - name: Pytest (including architecture tests)
        run: uv run --locked python -m pytest -q

      - name: Ruff lint
        run: uv run --locked python -m ruff check .

      - name: Ruff formatting
        run: uv run --locked python -m ruff format --check .

      - name: Mypy strict
        run: uv run --locked python -m mypy --strict src

      - name: OpenSpec strict validation
        run: openspec validate --all --strict
